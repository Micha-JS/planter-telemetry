# Eclipse Mosquitto configuration for local development.

listener 1883

# Anonymous access is fine while the only clients are the local simulator and
# development tools: the compose file binds this listener to host loopback, so
# it is never reachable from the LAN. Real devices use the opt-in hardware
# mode instead — a second, authenticated LAN listener on 1884
# (docker-compose.hardware.yml + mosquitto.hardware.conf; see
# docs/hardware-bridge.md).
allow_anonymous true

# No persistence: the broker is a transient transport; durable state lives in
# the database (from M2 onward).
persistence false

log_dest stdout
