# Eclipse Mosquitto configuration for hardware mode.
#
# Loaded ONLY via docker-compose.hardware.yml, which mounts this file over
# /mosquitto/config/mosquitto.conf in place of mosquitto.conf. The default
# demo path never reads this file.

# Must appear before any listener or per-listener security option; mosquitto
# refuses to start otherwise. With this enabled, allow_anonymous /
# password_file / acl_file apply to the most recently declared listener,
# so the ordering below is load-bearing.
per_listener_settings true

# Listener 1: the unchanged demo/internal listener. The base compose file
# publishes it as 127.0.0.1:1883, so it is reachable only from the compose
# network and host loopback — the simulator, ingestion, capture/replay CLI,
# and the container healthcheck keep using it anonymously, exactly as in
# demo mode.
listener 1883
allow_anonymous true

# Listener 2: the LAN-facing device listener, published as 0.0.0.0:1884 by
# docker-compose.hardware.yml. Authenticated: each device's MQTT username IS
# its device_id, and the ACL restricts it to publishing its own telemetry
# subtree. The password file is generated locally (make hardware-passwd) and
# never committed.
listener 1884
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl.conf

# Same as demo mode: the broker is a transient transport; durable state lives
# in the database.
persistence false

log_dest stdout
