# ACL for the authenticated LAN listener (1884) only — per_listener_settings
# true in mosquitto.hardware.conf scopes this file to the listener that
# declared it. The internal listener (1883) has no ACL, unchanged from demo
# mode.
#
# Username == device_id: a device may publish ("write") exactly its own
# telemetry topic and nothing else. Devices get no read access — pods are
# publish-only. Ingestion additionally cross-checks the payload device_id
# against the topic segment and dead-letters mismatches.
pattern write planter/v1/%u/telemetry
