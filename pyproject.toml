[project]
name = "planter-telemetry"
dynamic = ["version"]
description = "End-to-end IoT telemetry pipeline for an ESP32 planter sensor pod: MQTT ingestion, TimescaleDB storage, provisioned Grafana dashboards, and refill forecasting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13",
    "aiomqtt>=2.5.1",
    "alembic>=1.16",
    "paho-mqtt>=2.1",
    "prometheus-client>=0.23",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0",
    "ruff>=0.12",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0",
]

[build-system]
# uv.lock does not cover PEP 517 build requirements, and the string-form
# `license` above is PEP 639 (hatchling >= 1.26) — keep the backend bounded.
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/planter_telemetry/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/planter_telemetry"]

[tool.alembic]
# For the dev CLI (`uv run alembic ...`) only; the runtime and the test suite
# build their Config programmatically (planter_telemetry.migrate.build_config)
# so migrations work from the installed wheel regardless of cwd.
script_location = "%(here)s/src/planter_telemetry/migrations"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs docker (real broker + TimescaleDB via testcontainers)",
]
# Unit tests are the default; run `make integration` (or pytest -m integration)
# for the docker-backed suite.
addopts = "-m 'not integration'"
