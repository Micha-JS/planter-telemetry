[project]
name = "planter-telemetry"
dynamic = ["version"]
description = "End-to-end IoT telemetry pipeline for an ESP32 planter sensor pod: MQTT ingestion, TimescaleDB storage, provisioned Grafana dashboards, and refill forecasting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "mypy>=1.16",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
# uv.lock does not cover PEP 517 build requirements, and the string-form
# `license` above is PEP 639 (hatchling >= 1.26) — keep the backend bounded.
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/planter_telemetry/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/planter_telemetry"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
