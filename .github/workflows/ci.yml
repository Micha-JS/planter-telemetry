name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # Pin the tool that interprets uv.lock, so CI results only change
          # when the repo does.
          version: "0.11.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Integration tests (real broker + TimescaleDB)
        run: make integration

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Broker pub/sub round-trip
        run: make smoke

      - name: Simulator stream reaches the broker
        run: make sim-smoke

      - name: Full pipeline lands rows in the database
        run: make ingest-smoke

      - name: Grafana serves the provisioned dashboard over live data
        run: make grafana-smoke

      - name: Analytics forecasts live data, fires an alert, re-runs clean
        # Starts from a clean volume (down -v) so the seeded fleet's rates —
        # and therefore the guaranteed firing alert — are deterministic.
        run: make analytics-smoke

      - name: All services healthy; sample replay is idempotent end-to-end
        run: make replay-smoke

      - name: Second up against the persisted volume (migrate is a no-op)
        # replay-smoke left the named volume behind, so this exercises the
        # existing-database migration path, not just migrate-from-empty.
        # `up -d` itself fails if migrate exits nonzero: ingestion depends on
        # migrate with condition service_completed_successfully.
        run: |
          docker compose up -d
          docker compose down -v

  hardware-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hardware-mode compose merge parses; hardware broker config boots
        # Validation only, with a throwaway passwd file — hardware mode never
        # enters the default smoke path (that is the point of the override).
        run: make hardware-config-check

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docs have no dead relative links or anchors
        # Offline-only: http(s) URLs are skipped by design, so this job cannot
        # fail on someone else's downtime.
        run: make link-check
