services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # Loopback only: the broker allows anonymous access (see mosquitto.conf),
      # so it must not be reachable from the LAN. Containers on the compose
      # network are unaffected by the host binding.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "healthcheck", "-m", "ok"]
      interval: 2s
      timeout: 3s
      retries: 15

  timescaledb:
    image: timescale/timescaledb:2.28.3-pg17
    environment:
      # Dev-only credentials; the port is bound to loopback like the broker.
      POSTGRES_USER: planter
      POSTGRES_PASSWORD: planter
      POSTGRES_DB: planter
    ports:
      # 5433 on the host: only for local psql inspection, and 5432 is a
      # popular port for an already-running Postgres to be squatting on.
      - "127.0.0.1:5433:5432"
    volumes:
      # Named volume since M3: data survives restarts, and the migrate
      # service brings any database (empty or existing) to the current
      # schema on every up. `make down-clean` (compose down -v) restores
      # the fresh-demo behavior.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP: during initdb a temporary server listens on
      # the unix socket only, and a socket-based check would pass too early.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "planter", "-d", "planter"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

  migrate:
    build: .
    init: true
    # One-shot: alembic upgrade to head (stamping a pre-M3 database first),
    # then exits. Ingestion waits for it, so it can never race the schema.
    command: ["uv", "run", "--no-sync", "python", "-m", "planter_telemetry.migrate"]
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      INGEST_DB_DSN: postgresql://planter:planter@timescaledb:5432/planter

  ingestion:
    build: .
    init: true
    # Same image as the simulator (see Dockerfile header), different command.
    command: ["uv", "run", "--no-sync", "python", "-m", "planter_telemetry.ingestion"]
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      INGEST_MQTT_HOST: mosquitto
      INGEST_DB_DSN: postgresql://planter:planter@timescaledb:5432/planter
      # All INGEST_* knobs are documented in the README's Ingestion section.

  simulator:
    build: .
    init: true
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      SIM_MQTT_HOST: mosquitto
      # All SIM_* knobs (device count, seed, acceleration, imperfection
      # rates) are documented in the README's Simulator section.

  grafana:
    image: grafana/grafana:12.3.0
    ports:
      # Loopback only, like the broker and the database: anonymous viewer
      # access is enabled below, so the dashboard must not be LAN-visible.
      - "127.0.0.1:3000:3000"
    environment:
      # Local demo: no login wall for viewing; admin (for editing while
      # prototyping) stays password-protected. Dev-only default.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-planter}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Must match the default org name byte-for-byte, trailing dot included.
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/planter-fleet.json
      # Interpolated by Grafana itself into the provisioned datasource yaml —
      # the read-only role that migration 0007 creates.
      GRAFANA_DB_USER: grafana_reader
      GRAFANA_DB_PASSWORD: grafana_reader
    volumes:
      # Everything Grafana is provisioned from these read-only mounts; its
      # internal sqlite is deliberately ephemeral (no volume), so down/up
      # reproduces the identical instance from the repo alone.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        # The datasource connects as grafana_reader, which migration 0007
        # creates — before migrate finishes there is nothing to log in as.
        condition: service_completed_successfully
    healthcheck:
      # /api/health only proves Grafana's own sqlite. This endpoint makes
      # Grafana run the postgres datasource health check — SELECT 1 through
      # the provisioned datasource — so healthy means "can reach TimescaleDB
      # as grafana_reader". The image ships busybox wget (no curl), which
      # exits nonzero on any non-2xx response.
      test: ["CMD", "wget", "-q", "-O", "/dev/null",
             "http://127.0.0.1:3000/api/datasources/uid/planter-timescaledb/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  pgdata:
